name: Aggiorna Titoli del Momento

on:
  schedule:
    - cron: "0 3 * * *"   # ogni giorno alle 03:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run update script
        run: node update-trending.js
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@github"
          git add trending-history.json
          git commit -m "aggiorna titoli del momento" || echo "Nessuna modifica"
          git push
