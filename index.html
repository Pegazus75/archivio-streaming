<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cineteca Streaming</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="logo">Cineteca</h1>

    <nav class="top-tabs">
      <button class="tab active" data-view="all">Home</button>
      <button class="tab" data-view="latest">Ultimi</button>
      <button class="tab" data-view="films">Film</button>
      <button class="tab" data-view="series">Serie</button>
      <button class="tab" data-view="cineteca">Cineteca</button>
      <button class="tab" data-view="animation">Animazione</button>
      <button class="tab" data-view="collections">Collezioni</button>
      <button class="tab" data-view="list">Elenco</button>
    </nav>

    <div class="controls">
      <input id="searchBox" placeholder="Cerca titolo..." />
      <select id="genreFilter"><option value="">Tutti i generi</option></select>
      <select id="yearFilter"><option value="">Tutti gli anni</option></select>
    </div>
  </div>
</header>

<main id="main-content"></main>

<!-- MODAL -->
<div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <button id="modalClose" class="modal-close">✕</button>

    <div class="modal-body">
      <img id="modalPoster">

      <div class="modal-info">
        <h3 id="modalTitle"></h3>
        <div id="modalMeta"></div>
        <p id="modalPlot"></p>

        <!-- ✅ QUESTO MANCAVA -->
        <div id="modalEpisodes" style="margin-top:12px;"></div>

        <a
          id="modalTelegram"
          target="_blank"
          style="display:none"
          class="btn"
        >
          Apri su Telegram
        </a>
      </div>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
